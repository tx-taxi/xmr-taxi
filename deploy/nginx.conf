worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  client_max_body_size 10m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

  # Do not interpolate arbitrary URL text into HTML. Only known locale
  # prefixes and conservative path characters can form a canonical URL.
  # Query strings are excluded and unsupported characters fall back to /.
  map $request_uri $localized_canonical_path {
    default /;
    "~^/(?<canonical_language>ar|ca|cs|da|de|es|fa|fr|hr|ja|ka|ko|it|he|nl|nb|pl|pt|sl|sv|th|tr|uk|fi|vi|hu|mk|zh|ro|ru|hi|ne|lt)(?<canonical_suffix>/[A-Za-z0-9_/-]*)(?:\?.*)?$" /$canonical_language$canonical_suffix;
  }

  # Open Graph uses a language_territory tag. The values are the standard
  # likely territories for the site's language-only locale URLs.
  map $localized_canonical_path $localized_og_locale {
    default en_US;
    ~^/ar/ ar_EG;
    ~^/ca/ ca_ES;
    ~^/cs/ cs_CZ;
    ~^/da/ da_DK;
    ~^/de/ de_DE;
    ~^/es/ es_ES;
    ~^/fa/ fa_IR;
    ~^/fr/ fr_FR;
    ~^/hr/ hr_HR;
    ~^/ja/ ja_JP;
    ~^/ka/ ka_GE;
    ~^/ko/ ko_KR;
    ~^/it/ it_IT;
    ~^/he/ he_IL;
    ~^/nl/ nl_NL;
    ~^/nb/ nb_NO;
    ~^/pl/ pl_PL;
    ~^/pt/ pt_BR;
    ~^/sl/ sl_SI;
    ~^/sv/ sv_SE;
    ~^/th/ th_TH;
    ~^/tr/ tr_TR;
    ~^/uk/ uk_UA;
    ~^/fi/ fi_FI;
    ~^/vi/ vi_VN;
    ~^/hu/ hu_HU;
    ~^/mk/ mk_MK;
    ~^/zh/ zh_CN;
    ~^/ro/ ro_RO;
    ~^/ru/ ru_RU;
    ~^/hi/ hi_IN;
    ~^/ne/ ne_NP;
    ~^/lt/ lt_LT;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/browser;
    index index.html;

    # Security headers (origin-level). Inherited by every response that does
    # not set its own add_header — i.e. all HTML/SPA + proxied routes below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
      proxy_pass http://127.0.0.1:8999/healthz;
    }

    location /api/v1/ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    location /ws {
      proxy_pass http://127.0.0.1:8999/api/v1/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
    }

    # Anonymous migration counters: omit address/request access logs entirely.
    location = /api/v1/migration-events {
      access_log off;
      error_log /dev/null crit;
      client_max_body_size 128;
      proxy_pass http://127.0.0.1:8999/api/v1/migration-events;
      proxy_set_header Host $http_host;
    }

    location /api/v1/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    # Block-height deep links use the existing bare-prefix backend endpoint.
    # Preserve it instead of applying the generic /api/ -> /api/v1/ rewrite.
    location /api/block-height/ {
      proxy_pass http://127.0.0.1:8999;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8999/api/v1/;
      proxy_set_header Host $host;
    }

    location /resources/ {
      try_files $uri =404;
      expires 1h;
    }

    location ^~ /source/ {
      return 404;
    }

    location = /3rdpartylicenses.txt {
      try_files /en-US/3rdpartylicenses.txt =404;
      default_type text/plain;
      expires 1h;
    }

    # Build-generated canonical pages, aliases and LLM discovery.
    include /etc/nginx/native-seo.conf;

    location = /sitemap.xml {
      default_type application/xml;
      try_files /sitemap.xml =404;
    }

    # Version-controlled robots.txt (note: a Cloudflare-managed robots.txt may
    # still override this at the edge).
    location = /robots.txt {
      try_files $uri /en-US/robots.txt =404;
    }

    location ~ ^/(tx|block)/[A-Za-z0-9]+/?$ {
      proxy_pass http://127.0.0.1:8999;
      proxy_set_header Host $host;
    }

    # Keep translated entity views, with the same verified metadata and clean canonical.
    location ~ ^/(ar|bg|bs|ca|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi|ne)/(tx|block)/[A-Za-z0-9]+/?$ {
      proxy_pass http://127.0.0.1:8999;
      proxy_set_header Host $host;
    }

    location ^~ /og/xmr/ {
      proxy_pass http://127.0.0.1:8999;
      proxy_set_header Host $host;
    }

    # Content-hashed bundles are immutable — cache them for a year. The hash
    # segment in the regex keeps un-hashed files (e.g. /resources/config.js)
    # out of this rule so they stay on the shorter cache.
    location ~* "\.[0-9a-f]{8,}\.(?:js|css|woff2?|ttf|otf|eot|svg|webp|png|jpe?g|gif)$" {
      try_files $uri /en-US$uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = / {
      try_files /en-US/index.html =404;
      expires 10m;
    }

    # Later block-list pages are presentation views, not duplicate indexed documents.
    # Exact /blocks/1 (and its slash redirect) wins over this regex.
    location ~ ^/blocks/[0-9]+/?$ {
      try_files /blocks/1/index.html =404;
      add_header X-Robots-Tag "noindex, follow" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      expires 10m;
    }

    # Locale directory index filenames are aliases of their root URL.
    location ~ ^/(ar|ca|cs|da|de|es|fa|fr|hr|ja|ka|ko|it|he|nl|nb|pl|pt|sl|sv|th|tr|uk|fi|vi|hu|mk|zh|ro|ru|hi|ne|lt)/index\.html$ {
      absolute_redirect off;
      return 308 /$1/$is_args$args;
    }

    # Normalize a bare language prefix to its directory URL before serving
    # the translated shell, retaining query parameters.
    location ~ ^/(ar|ca|cs|da|de|es|fa|fr|hr|ja|ka|ko|it|he|nl|nb|pl|pt|sl|sv|th|tr|uk|fi|vi|hu|mk|zh|ro|ru|hi|ne|lt)$ {
      absolute_redirect off;
      return 308 /$1/$is_args$args;
    }

    location ~ ^/(ar|bg|bs|ca|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi|ne|lt|hr)/ {
      try_files $uri/index.html $uri /$1/index.html /en-US/index.html =404;
      # These pages remain noindex until translated content and metadata have
      # been reviewed, but should still describe their actual locale URL.
      sub_filter '<link id="canonical" rel="canonical" href="https://xmr.tx.taxi/">' '<link id="canonical" rel="canonical" href="https://xmr.tx.taxi$localized_canonical_path">';
      sub_filter '<meta property="og:url" content="https://xmr.tx.taxi/"' '<meta property="og:url" content="https://xmr.tx.taxi$localized_canonical_path"';
      sub_filter '<meta property="og:locale" content="en_US"' '<meta property="og:locale" content="$localized_og_locale"';
      sub_filter_once on;
      add_header X-Robots-Tag "noindex, follow" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
      try_files $uri/index.html $uri /en-US$uri /en-US/index.html =404;
      add_header X-Robots-Tag "noindex, follow" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      expires 10m;
    }
  }
}
