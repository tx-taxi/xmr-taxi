<div class="text-center blockchain-wrapper" [class.time-ltr]="timeLtr" [class.ltr-transition]="ltrTransitionEnabled" #container>
  <div #positionContainer class="position-container" [ngClass]="network ? network : ''" [style]="positionStyle">
    <span>
      <div class="blocks-wrapper">
        <div class="scroll-spacer" *ngIf="minScrollWidth" [style.left]="minScrollWidth + 'px'"></div>
        <app-mempool-blocks [hidden]="pageIndex > 0" [allBlocks]="scrollableMempool" (widthChange)="onMempoolWidthChange($event)"></app-mempool-blocks>
        <app-blockchain-blocks [hidden]="pageIndex > 0"></app-blockchain-blocks>
        <ng-container *ngFor="let page of pages; trackBy: trackByPageFn">
          <app-blockchain-blocks [static]="true" [offset]="page.offset" [height]="page.height" [count]="blocksPerPage" [loadingTip]="loadingTip" [connected]="connected"></app-blockchain-blocks>
        </ng-container>
      </div>
      <div id="divider" [hidden]="pageIndex > 0">
        <a class="chain-divider-mark" [routerLink]="['/' | relativeUrl]" aria-label="Monero explorer dashboard" i18n-aria-label="@@xmr.strip.dashboard"><img src="/resources/branding/monero-divider.png" alt=""></a>
        <button
          type="button"
          class="block-display-toggle"
          (click)="toggleBlockDisplayMode()"
          [attr.aria-label]="blockDisplayMode === 'fees'
            ? blockSizeLabel
            : blockFeesLabel"
          [attr.title]="blockDisplayMode === 'fees'
            ? blockSizeLabel
            : blockFeesLabel">
          <fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon>
        </button>

        <button
          type="button"
          class="time-toggle"
          (click)="toggleTimeDirection()"
          [attr.aria-label]="timeLtr
            ? newestRightLabel
            : newestLeftLabel"
          [attr.title]="timeLtr
            ? newestRightLabel
            : newestLeftLabel">
          <fa-icon [icon]="['fas', 'exchange-alt']" [fixedWidth]="true"></fa-icon>
        </button>
      </div>
    </span>
  </div>
</div>
