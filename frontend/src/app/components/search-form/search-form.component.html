<form role="search" aria-label="Chain search" [class]="{hamburgerOpen: hamburgerOpen}" [formGroup]="searchForm" (submit)="searchForm.valid && search()" novalidate>
  <div class="d-flex search-form-row" [style.--search-chain-accent]="(activeTarget$ | async)?.accentColor || defaultChainAccent">
    <div class="search-box-container me-2">
      <label class="visually-hidden" for="xmr-search-input">{{ defaultSearchPlaceholder }}</label>
      <div class="search-input-row">
        <div ngbDropdown #chainMenu="ngbDropdown" [autoClose]="false" class="search-chain-selector" placement="bottom-start">
          <button ngbDropdownToggle type="button" class="search-chain-trigger" aria-label="Choose search chain" title="Choose search chain">
            <ng-container *ngIf="activeTarget$ | async as activeTarget; else defaultChainIcon">
              <img [src]="activeTarget.iconUrl" [alt]="activeTarget.iconAlt">
            </ng-container>
            <ng-template #defaultChainIcon>
              <img [src]="defaultChainIconUrl" [alt]="defaultChainIconAlt">
            </ng-template>
          </button>
          <div ngbDropdownMenu class="search-chain-menu" aria-label="Choose search chain">
            <div class="search-chain-option search-chain-explorer search-chain-automatic"
              [class.is-current]="isAutomaticRoutingSelected()" style="--chain-option-accent: #ffd21f">
              <button type="button" ngbDropdownItem class="search-chain-select"
                [attr.aria-pressed]="isAutomaticRoutingSelected()" (click)="selectAutomaticRouting()">
                <img src="https://tx.taxi/assets/brand/router-favicon.svg" alt="">
                <span class="search-chain-copy">
                  <span class="search-chain-name">Automatic Routing</span>
                  <span class="search-chain-host">tx.taxi</span>
                </span>
              </button>
              <span class="search-chain-actions">
                <a class="search-chain-new-tab" href="https://tx.taxi/" target="_blank" rel="noopener noreferrer"
                  aria-label="Open tx.taxi in a new tab" title="Open tx.taxi in a new tab">
                  <fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon>
                </a>
                <a class="search-chain-switch" href="https://tx.taxi/">View Hub</a>
              </span>
            </div>
            <span class="search-chain-group-label">NATIVE EXPLORERS</span>
            <ng-container *ngIf="searchOptions$ | async as searchOptions">
              <ng-container *ngIf="searchOptions.candidates.length">

                <button
                  *ngFor="let candidate of searchOptions.candidates; trackBy: trackCandidate"
                  [hidden]="!candidate.firstParty"
                  type="button"
                  ngbDropdownItem
                  class="search-chain-option search-chain-candidate"
                  [class.is-current]="isSelectedCandidate(candidate)"
                  [attr.aria-pressed]="isSelectedCandidate(candidate)"
                  [style.--chain-option-accent]="candidate.accentColor"
                  (click)="selectCandidate(candidate)"
                >
                  <img [src]="candidate.iconUrl" alt="">
                  <span class="search-chain-copy">
                    <span class="search-chain-name">{{ candidate.name }}</span>
                    <span class="search-chain-host">{{ candidate.host }}</span>
                  </span>
                  <span class="search-chain-match" [class.is-confirmed]="candidate.confirmed">
                    {{ candidate.confirmed ? 'Found' : 'Possible' }}
                  </span>
                </button>
                <div class="search-chain-divider" aria-hidden="true"></div>
              </ng-container>
            </ng-container>
            <ng-container *ngIf="explorers$ | async as explorers; else explorerRegistryLoading">

              <div
                *ngFor="let explorer of explorers; trackBy: trackExplorer"
                class="search-chain-option search-chain-explorer"
                [class.is-current]="isSelectedExplorer(explorer)"
                [style.--chain-option-accent]="explorer.accentColor"
              >
                <button type="button" ngbDropdownItem class="search-chain-select"
                  [attr.aria-pressed]="isSelectedExplorer(explorer)"
                  (click)="selectExplorer(explorer)">
                <img [src]="explorer.iconUrl" alt="">
                <span class="search-chain-copy">
                  <span class="search-chain-name">{{ explorer.name }}</span>
                  <span class="search-chain-host">{{ explorer.host }}</span>
                </span>
                </button>
                <span *ngIf="explorer.chainId === sourceChainId; else explorerActions" class="search-chain-opened">Opened</span>
                <ng-template #explorerActions>
                  <span class="search-chain-actions">
                    <a class="search-chain-new-tab" [href]="explorer.origin" target="_blank" rel="noopener noreferrer"
                      [attr.aria-label]="'Open ' + explorer.name + ' in a new tab'" [attr.title]="'Open ' + explorer.name + ' in a new tab'">
                      <fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon>
                    </a>
                    <a class="search-chain-switch" [href]="explorer.origin"
                      [attr.aria-label]="'Switch to ' + explorer.name">Switch</a>
                  </span>
                </ng-template>
              </div>
              <span *ngIf="!explorers.length" class="search-chain-message">Explorer registry unavailable</span>
            </ng-container>
            <span class="search-chain-group-label">3RD-PARTY EXPLORERS</span>
            <ng-container *ngIf="searchOptions$ | async as searchOptions">
              <ng-container *ngIf="searchOptions.candidates.length">

                <button
                  *ngFor="let candidate of searchOptions.candidates; trackBy: trackCandidate"
                  [hidden]="candidate.firstParty"
                  type="button"
                  ngbDropdownItem
                  class="search-chain-option search-chain-candidate"
                  [class.is-current]="isSelectedCandidate(candidate)"
                  [attr.aria-pressed]="isSelectedCandidate(candidate)"
                  [style.--chain-option-accent]="candidate.accentColor"
                  (click)="selectCandidate(candidate)"
                >
                  <img [src]="candidate.iconUrl" alt="">
                  <span class="search-chain-copy">
                    <span class="search-chain-name">{{ candidate.name }}</span>
                    <span class="search-chain-host">{{ candidate.host }}</span>
                  </span>
                  <span class="search-chain-match" [class.is-confirmed]="candidate.confirmed">
                    {{ candidate.confirmed ? 'Found' : 'Possible' }}
                  </span>
                </button>
                <div class="search-chain-divider" aria-hidden="true"></div>
              </ng-container>
            </ng-container>

            <div *ngFor="let explorer of thirdPartyExplorers$ | async" class="search-chain-option search-chain-explorer" [style.--chain-option-accent]="explorer.accentColor">
              <a class="search-chain-select" [href]="explorer.origin" [attr.aria-label]="'Open ' + explorer.name">
                <img [src]="explorer.iconUrl" alt="">
                <span class="search-chain-copy"><span class="search-chain-name">{{ explorer.name }}</span><span class="search-chain-host">{{ explorer.host }}</span></span>
              </a>
              <span class="search-chain-actions">
                <a class="search-chain-new-tab" [href]="explorer.origin" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Open ' + explorer.name + ' in a new tab'" [attr.title]="'Open ' + explorer.name + ' in a new tab'"><fa-icon [icon]="['fas', 'external-link-alt']" aria-hidden="true"></fa-icon></a>
                <a class="search-chain-switch" [href]="explorer.origin">Open</a>
              </span>
            </div>
            <ng-template #explorerRegistryLoading>
              <span class="search-chain-message">Loading explorers</span>
            </ng-template>
          </div>
        </div>
        <input
          #searchInput
          id="xmr-search-input"
          (focus)="onSearchInputFocus()"
          (click)="showSourceSuggestions()"
          (input)="showSourceSuggestions()" formControlName="searchText"
          type="text"
          class="form-control"
          [placeholder]="defaultSearchPlaceholder"
          [attr.aria-label]="defaultSearchPlaceholder"
          aria-autocomplete="list"
          aria-controls="xmr-search-results-listbox"
          [attr.aria-expanded]="isSourceChainSelected() && !dropdownHidden"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >
      </div>
      <app-search-results #searchResults [hidden]="dropdownHidden || !isSourceChainSelected()" [results]="typeAhead$ | async" (selectedResult)="selectedResult($event)"></app-search-results>
    </div>
    <div>
      <button [disabled]="isSearching" type="submit" class="btn btn-purple search-submit" aria-label="Search selected chain" title="Search selected chain">
        <fa-icon *ngIf="!(isTypeaheading$ | async) else searchLoading" [icon]="['fas', 'search']" [fixedWidth]="true" i18n-title="search-form.search-title" title="Search"></fa-icon>
      </button>
    </div>
  </div>
</form>

<ng-template #searchLoading>
  <div class="spinner-border spinner-border-sm" style="color: #fff" role="status" aria-hidden="true" (click)="searchForm.valid && search()"></div>
</ng-template>
