<div *ngIf="showTitle" class="main-title">{{ mode === 'difficulty' ? 'Difficulty Adjustment' : 'Reward stats' }}</div>
<div class="card-wrapper">
  <div class="card">
    <div class="widget-toggler">
      <a href="" (click)="setMode('difficulty')" class="toggler-option" [class.inactive]="mode === 'difficulty'"><small>difficulty</small></a>
      <span class="toggler-divider"> | </span>
      <a href="" (click)="setMode('rewards')" class="toggler-option" [class.inactive]="mode === 'rewards'"><small>rewards</small></a>
    </div>
    <div *ngIf="mode === 'difficulty'; else rewards" class="card-body more-padding">
      <div class="difficulty-adjustment-container" *ngIf="(isLoadingWebSocket$ | async) === false && (status$ | async) as status; else loadingDifficulty">
        <app-block-pace-graph [data]="paceData" [compressed]="true" class="block-pace-graph"></app-block-pace-graph>
        <div class="difficulty-stats">
          <div class="item">
            <div class="card-text" *ngIf="status.averageBlockTime != null; else unavailableTime">~<app-time [time]="status.averageBlockTime" [fractionDigits]="1"></app-time></div>
            <ng-template #unavailableTime><div class="card-text">—</div></ng-template>
            <div class="symbol">Average block time</div>
          </div>
          <div class="item">
            <div class="card-text bigger" *ngIf="status.pacePercent != null; else unavailablePace"
              [style.color]="status.pacePercent > 0 ? 'var(--green)' : status.pacePercent < 0 ? 'var(--red)' : 'var(--transparent-fg)'">
              <fa-icon [icon]="['fas', status.pacePercent >= 0 ? 'caret-up' : 'caret-down']" [fixedWidth]="true"></fa-icon>
              {{ status.pacePercent | absolute | number:'1.2-2' }}<span class="symbol">%</span>
            </div>
            <ng-template #unavailablePace><div class="card-text">—</div></ng-template>
            <div class="symbol" ngbTooltip="Recent blocks compared with Monero's two-minute target" placement="bottom">Block pace</div>
          </div>
          <div class="item">
            <div class="card-text" *ngIf="status.difficultyChangePercent != null; else unavailableChange"
              [style.color]="status.difficultyChangePercent > 0 ? 'var(--green)' : status.difficultyChangePercent < 0 ? 'var(--red)' : 'var(--transparent-fg)'">
              <fa-icon [icon]="['fas', status.difficultyChangePercent >= 0 ? 'caret-up' : 'caret-down']" [fixedWidth]="true"></fa-icon>
              {{ status.difficultyChangePercent | absolute | number:'1.2-2' }}<span class="symbol">%</span>
            </div>
            <ng-template #unavailableChange><div class="card-text">—</div></ng-template>
            <div class="symbol">Difficulty Δ</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #rewards>
  <div class="card-body more-padding reward-stats-panel"><app-reward-stats></app-reward-stats></div>
</ng-template>

<ng-template #loadingDifficulty>
  <div class="schedule-bar-container"><div class="skeleton-loader" style="height: 80px"></div></div>
  <div class="difficulty-skeleton loading-container">
    <div class="item" *ngFor="let label of ['Average block time', 'Block pace', 'Difficulty Δ']">
      <div class="card-text"><div class="skeleton-loader"></div><div class="skeleton-loader"></div></div>
    </div>
  </div>
</ng-template>
