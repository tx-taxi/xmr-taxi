<section class="taxi-docs-intro" aria-label="About tx.taxi">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} documentation</p>
    <h2>One search across chains.</h2>
    <p>Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" href="https://tx.taxi/">Open tx.taxi <span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" href="/" [attr.aria-label]="'Open ' + chainHost">Explore {{ chainName }} <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
