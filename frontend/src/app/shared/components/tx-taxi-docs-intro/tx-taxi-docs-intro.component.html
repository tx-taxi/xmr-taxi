<section class="taxi-docs-intro" aria-label="About tx.taxi" i18n-aria-label="@@xmr.intro.aria">
  <div class="taxi-docs-art" aria-hidden="true"></div>
  <div class="taxi-docs-copy">
    <p class="taxi-docs-eyebrow">tx.taxi <span aria-hidden="true">/</span> {{ chainName }} {{ context }}</p>
    <h2 i18n="@@xmr.intro.title">One search across chains.</h2>
    <p i18n="@@xmr.intro.description">Paste a transaction, block or address into tx.taxi. Open a confirmed match, choose between possible networks, or head straight to your chain’s explorer.</p>
    <div class="taxi-docs-actions">
      <a class="taxi-docs-button" href="https://tx.taxi/" i18n="@@xmr.intro.openTaxi">Open tx.taxi <span aria-hidden="true">↗︎</span></a>
      <a class="taxi-docs-native" routerLink="/" [attr.aria-label]="'Open ' + chainHost" i18n="@@xmr.intro.exploreChain">Explore {{ chainName }} <span aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
