<div class="promotion" *ngIf="!dismissed">
  <a class="promotion-link" [href]="destination" target="_blank" rel="noopener noreferrer">
    <span class="promotion-intro">From the creators of tx.taxi:</span>
    <span class="promotion-message">Buy, Sell, &amp; Swap <span class="promotion-accent">{{ chainName }}</span> starting at <strong>0% uSwap Fees</strong> with <span class="promotion-accent">uSwap</span></span>
    <span class="promotion-intro">Trusted for 6,000+ swaps totaling $5M+.</span>
  </a>
  <button type="button" class="btn-close btn-close-white promotion-close" aria-label="Dismiss uSwap promotion" title="Dismiss" (click)="dismiss()"></button>
</div>
